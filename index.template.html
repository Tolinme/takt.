<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173f35" />
  <title>Такт — задачи в своём ритме</title>
  <meta name="description" content="Универсальный трекер задач: доска, список, календарь, проекты и сохранённые виды. Работает офлайн, хранит данные в браузере." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23173f35'/%3E%3Cpath d='M16 40V24M28 44V16M40 36V28M52 42V20' stroke='%23c7e86d' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <!-- STYLES -->
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 16v-6M9 18V6M14 14v-4M19 17V8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
      <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4ZM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m0 0 4 4m-4-4-4 4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9a2.5 2.5 0 1 1 3.8 2.1c-.8.5-1.3 1-1.3 2M12 16.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 14h5l1.5 2h3L15 14h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-upcoming" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="18.5" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8 12.5 2.7 2.7L16.5 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 4h7l9 9-7 7-9-9V4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8.5" cy="8.5" r="1.3"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4m0 1h11l-2 3.5L17 12H6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-subtask" viewBox="0 0 24 24"><path d="M6 4v10a3 3 0 0 0 3 3h9M15 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="2" width="6" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-drag" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5V4ZM8 4v5h7V4M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 22 20H2L12 3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v5M12 17h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5 4 9l4 4M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3ZM18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z" fill="currentColor"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m0 0-5-5m5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <div class="app-shell" id="appShell">
    <div class="sidebar-scrim" id="sidebarScrim" data-action="close-sidebar"></div>
    <aside class="sidebar" id="sidebar" aria-label="Навигация">
      <div class="brand">
        <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
        <span class="brand-name">такт<span class="brand-dot">.</span></span>
        <button class="icon-btn sidebar-close" data-action="close-sidebar" aria-label="Закрыть меню"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="workspace-label">Личное пространство</div>
      <nav class="nav" id="mainNav" aria-label="Разделы"></nav>
      <div class="side-section">
        <div class="side-heading"><span>Проекты</span><button class="mini-btn" data-action="project-new" aria-label="Новый проект"><svg class="icon"><use href="#i-plus"/></svg></button></div>
        <div id="projectList" class="project-list"></div>
      </div>
      <div class="side-section">
        <div class="side-heading"><span>Сохранённые виды</span><button class="mini-btn" data-action="save-view" aria-label="Сохранить текущий вид"><svg class="icon"><use href="#i-plus"/></svg></button></div>
        <div id="savedViewList" class="saved-list"></div>
      </div>
      <div class="sidebar-footer">
        <div class="storage-note" id="storageNote"><span class="pulse-dot"></span><span>Сохранено в браузере</span></div>
        <div class="side-actions">
          <button class="side-action" data-action="export-json"><svg class="icon"><use href="#i-download"/></svg><span>Экспорт</span></button>
          <button class="side-action" data-action="import"><svg class="icon"><use href="#i-upload"/></svg><span>Импорт</span></button>
          <button class="side-action" data-action="help"><svg class="icon"><use href="#i-help"/></svg><span>Справка</span></button>
        </div>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="open-sidebar" aria-label="Открыть меню"><svg class="icon"><use href="#i-menu"/></svg></button>
        <div class="breadcrumb" id="breadcrumb">Рабочее пространство <span>/</span> <strong>Все задачи</strong></div>
        <div class="search-wrap">
          <svg class="icon search-icon"><use href="#i-search"/></svg>
          <input id="globalSearch" type="search" placeholder="Поиск задач, тегов, проектов…" autocomplete="off" aria-label="Поиск задач" />
          <kbd class="search-kbd">/</kbd>
          <button class="search-clear" id="searchClear" data-action="clear-search" aria-label="Очистить поиск" hidden><svg class="icon"><use href="#i-close"/></svg></button>
        </div>
        <button class="icon-btn theme-btn" id="themeToggle" data-action="theme-toggle" aria-label="Переключить тему"><svg class="icon"><use href="#i-moon"/></svg></button>
        <button class="btn btn-primary new-task-btn" data-action="new-task"><svg class="icon"><use href="#i-plus"/></svg><span>Новая задача</span></button>
      </header>

      <div class="content" id="content">
        <section class="page-head">
          <div class="page-title-wrap">
            <h1 id="pageTitle">Все задачи</h1>
            <p id="pageSubtitle" class="page-subtitle"></p>
          </div>
          <div class="head-metrics" id="headMetrics"></div>
        </section>
        <div id="storageBanner"></div>
        <section class="toolbar" id="toolbar" aria-label="Представление и фильтры"></section>
        <div id="activeFilters" class="active-filters"></div>
        <section id="viewRoot" class="view-root" aria-live="polite"></section>
      </div>
    </main>
  </div>

  <div id="bulkBar" class="bulk-bar" hidden></div>
  <div id="drawerRoot"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />
  <div id="liveRegion" class="sr-only" aria-live="polite"></div>
  <!-- SCRIPT -->
</body>
</html>
